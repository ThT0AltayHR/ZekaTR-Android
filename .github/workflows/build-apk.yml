name: Build ZekaTR Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK araçlarını kur
        uses: android-actions/setup-android@v3

      - name: Gradle ile release APK derle
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: APK adını uygulama adına göre ayarla
        run: |
          mkdir -p dist
          apk_path=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk_path"
          cp "$apk_path" dist/ZekaTR.apk
          test -s dist/ZekaTR.apk

      - name: Release APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: ZekaTR-release-apk
          path: dist/ZekaTR.apk
          if-no-files-found: error

      - name: GitHub Release oluştur
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build.{1}', '2.0.0', github.run_number) }}
          name: ZekaTR Release
          body: |
            ZekaTR release APK.
            Dosya: ZekaTR.apk
          files: dist/ZekaTR.apk
          make_latest: true
