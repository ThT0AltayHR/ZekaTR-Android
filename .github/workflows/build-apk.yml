name: Build ZekaTR Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK araçlarını kur
        uses: android-actions/setup-android@v3

      - name: Geçici release imzalama anahtarı oluştur
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ZekaTR-release.p12" \
            -storetype PKCS12 \
            -alias zekatr-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -keypass "$RELEASE_STORE_PASSWORD" \
            -dname "CN=ZekaTR, OU=Android, O=ZekaTR, L=Istanbul, ST=Istanbul, C=TR"
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Gradle ile release APK derle
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: APK’yı imzala ve doğrula
        run: |
          mkdir -p dist
          unsigned_apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$unsigned_apk"
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner_path"
          "$apksigner_path" sign \
            --ks "$RUNNER_TEMP/ZekaTR-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias zekatr-release \
            --ks-pass "pass:$RELEASE_STORE_PASSWORD" \
            --key-pass "pass:$RELEASE_STORE_PASSWORD" \
            --out dist/ZekaTR.apk \
            "$unsigned_apk"
          "$apksigner_path" verify --verbose dist/ZekaTR.apk
          test -s dist/ZekaTR.apk
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Release APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: ZekaTR-release-apk
          path: dist/ZekaTR.apk
          if-no-files-found: error

      - name: GitHub Release oluştur
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build.{1}', '2.0.0', github.run_number) }}
          name: ZekaTR Release
          body: |
            ZekaTR release APK.
            Dosya: ZekaTR.apk
          files: dist/ZekaTR.apk
          make_latest: true
