plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.muhammed.zekatr'
    compileSdk 34

    defaultConfig {
        applicationId "com.muhammed.zekatr"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Real network calls for web search / link preview / YouTube oEmbed
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Periodic (NOT continuous/infinite) background refresh, respects Doze/Battery limits
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Real Google Sign-In (requires a valid OAuth client ID configured in Google Cloud Console)
    implementation 'com.google.android.gms:play-services-auth:21.0.0'

    // Preview thumbnails (link/YouTube cards) - reliable async image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
