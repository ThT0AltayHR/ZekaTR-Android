plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.muhammed.zekatr'
    compileSdk 34

    defaultConfig {
        applicationId "com.muhammed.zekatr"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        // llama.cpp submodule eklendikten sonra yorumdan cikar (bkz. asagidaki
        // externalNativeBuild aciklamasi ve app/src/main/cpp/README.md):
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                abiFilters "arm64-v8a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // GGUF dosyalari zaten sikistirilamayacak kadar yogun (binary+quantized);
    // AAPT'nin bunlari sikistirmaya CALISMASINI engeller (hem derleme daha
    // hizli olur hem de bazi cihazlarda buyuk sikistirilmis assetlerin acilma
    // hatasi onlenir). app/src/main/assets/ggufmodel/*.gguf icin gecerli.
    androidResources {
        noCompress += ["gguf"]
    }

    // ================= YEREL GGUF CIKARIM MOTORU (llama.cpp) =================
    // Bu blok BILEREK KAPALI (yorum satiri) birakildi ki mevcut proje su an
    // llama.cpp kaynak kodu olmadan da SORUNSUZ derlensin. Gercek yerel model
    // cikarimini (token uretimini) ACMAK icin:
    //   1) Terminalde (bilgisayarinda, proje kok dizininde):
    //        git submodule add https://github.com/ggerganov/llama.cpp app/src/main/cpp/llama.cpp
    //   2) Asagidaki 4 satiri (externalNativeBuild + defaultConfig.externalNativeBuild.cmake)
    //      yorumdan cikar.
    //   3) app/src/main/cpp/README.md dosyasindaki adimlari izle (CMakeLists.txt
    //      ve llama_bridge.cpp zaten hazir, sadece submodule eklenmesini bekliyor).
    //
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    // ===========================================================================

    // TERMINAL FIX (Android 10+/W^X): bootstrap icindeki calistirilabilir dosyalar
    // artik jniLibs/arm64-v8a altinda lib_zt_*.so olarak paketleniyor. Android 10+
    // hedefleyen (targetSdk 29+) uygulamalarda app'in KENDI yazdigi private data
    // dizinindeki dosyalar calistirilamaz (noexec) - SADECE nativeLibraryDir bu
    // kisitlamadan muaftir. useLegacyPackaging = true, bu .so dosyalarinin APK
    // icinde SIKISTIRILMAMIS ve kurulum aninda gercek dosya olarak (mmap degil)
    // nativeLibraryDir'e cikartilmasini saglar - calistirilabilir olmalari icin sart.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Real network calls for web search / link preview / YouTube oEmbed
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Periodic (NOT continuous/infinite) background refresh, respects Doze/Battery limits
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Real Google Sign-In (requires a valid OAuth client ID configured in Google Cloud Console)
    implementation 'com.google.android.gms:play-services-auth:21.0.0'

    // Preview thumbnails (link/YouTube cards) - reliable async image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
